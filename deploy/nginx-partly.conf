# Sitio de Partly para el nginx instalado en el servidor (no el de Docker). `instalar-servidor.sh` reemplaza
# __DOMINIO__ y __RAIZ__ y lo copia a /etc/nginx/sites-available/partly. Después certbot le agrega el HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name __DOMINIO__ www.__DOMINIO__;
  root __RAIZ__;
  index index.html;
  server_tokens off;
  include /etc/nginx/snippets/partly-security-headers.conf;

  # La API (NestJS con pm2) solo escucha dentro del servidor: el puerto 3001 nunca se abre a Internet.
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Comprobantes de pago (imágenes o PDF).
    client_max_body_size 10m;
  }

  location / {
    # Las páginas públicas prerenderizadas tienen su propio index.html; el resto usa el shell del cliente.
    try_files $uri $uri/ /index.csr.html;
  }

  location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/partly-security-headers.conf;
    try_files $uri =404;
  }
}
