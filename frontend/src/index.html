<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="256x256" href="tequio-icon-square.png">

  <!--
    Production domain: tequio.com.mx
  -->

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Slack, iMessage previews) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tequio">
  <meta property="og:locale" content="es_MX">
  <meta property="og:url" content="https://tequio.com.mx/">

  <meta property="og:description" content="Divide el costo de Netflix, Spotify, Disney+ y más con quien tú quieras. Cupos verificados, credenciales cifradas y pagas solo por los días que usas.">

  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Tequio — comparte tus suscripciones y paga solo tu parte">

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tequio — Comparte tus suscripciones y paga solo tu parte">
  <meta name="twitter:description" content="Divide el costo de Netflix, Spotify, Disney+ y más con quien tú quieras. Ahorra hasta 75% con cupos verificados y credenciales cifradas.">
  <meta name="twitter:image" content="https://tequio.com.mx/og-image.png">
  <meta name="twitter:image:alt" content="Tequio — comparte tus suscripciones y paga solo tu parte">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Tequio",
    "url": "https://tequio.com.mx/",
    "logo": "https://tequio.com.mx/tequio-wordmark.png",
    "description": "Tequio permite compartir suscripciones de streaming y otras plataformas digitales de forma segura, con credenciales cifradas y pagando solo por los días que usas.",
    "sameAs": []
  }
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>
    <!--
      [appReveal] content starts at opacity:0 in CSS and only becomes visible
      once GSAP (JS) reveals it on scroll. With JS disabled that never
      happens, so force it visible here — <noscript> only renders when
      scripting is truly off, so this can never misfire during normal use
      (unlike a JS timeout guessing whether "enough time" has passed, which
      can't tell "still below the fold" apart from "actually broken").
    -->
    <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
  </noscript>
</body>
</html>
