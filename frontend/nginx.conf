server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Conserva el protocolo público enviado por el Nginx TLS del host.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 10m;
  }

  location / {
    # Las rutas pÃºblicas prerenderizadas resuelven sus propios index.html.
    # El resto usa el shell CSR para no hidratar la portada en una URL distinta.
    try_files $uri $uri/ /index.csr.html;
  }

  location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
}
